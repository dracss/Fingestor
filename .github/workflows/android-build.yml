name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache git zip unzip autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.1" buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Build APK (debug)
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          yes | buildozer android debug || true
          P4A=".buildozer/android/platform/python-for-android/pythonforandroid/recipes"
          if [ -f "$P4A/openssl/__init__.py" ]; then
            echo "Aplicando espelho do OpenSSL..."
            sed -i -E "s#https://www\.openssl\.org/source/openssl-(\{[a-z_]+\})\.tar\.gz#https://github.com/openssl/openssl/releases/download/openssl-\1/openssl-\1.tar.gz#g" "$P4A/openssl/__init__.py"
          fi
          if [ -f "$P4A/freetype/__init__.py" ]; then
            echo "Aplicando espelho do FreeType..."
            sed -i -E "s#https://download\.savannah\.gnu\.org/releases/freetype/freetype-(\{[a-z_]+\})\.tar\.gz#https://downloads.sourceforge.net/project/freetype/freetype2/\1/freetype-\1.tar.gz#g" "$P4A/freetype/__init__.py"
          fi
          n=0
          until [ $n -ge 6 ]; do
            yes | buildozer android debug && break
            n=$((n+1))
            echo "::warning::Tentativa $n falhou (provavel blip de download). Nova tentativa em 20s..."
            sleep 20
          done
          ls -la bin/*.apk || { echo "::error::Nenhum APK gerado."; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
